# Login Page
login.email=id:email
login.password=id:password
login.submit=xpath://button[text()='Sign in']

# Dashboard / Notes Page
notes.add.button=xpath://button[contains(text(),'Add Note')]

# Create Note Form
notes.title=id:title
notes.description=id:description
notes.category=id:category
notes.save.button=xpath://button[contains(text(),'Create')]

# Notes List
notes.card=xpath://div[contains(@class,'note-card')]