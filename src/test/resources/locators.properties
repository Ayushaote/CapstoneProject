# =========================
# Home Page
# =========================

home.login.button=xpath://a[contains(text(),'Login')]
home.create.account.button=xpath://a[contains(text(),'Create an account')]

# =========================
# Login Page
# =========================

login.email=id:email
login.password=id:password
login.submit=xpath://button[contains(text(),'Login')]

# =========================
# Notes Dashboard
# =========================

notes.add.button=css:button[data-testid='add-new-note']

notes.search.input=xpath://input[@placeholder='Search notes...']
notes.search.button=xpath://button[contains(text(),'Search')]

notes.filter.all=xpath://button[contains(text(),'All')]
notes.filter.home=xpath://button[contains(text(),'Home')]
notes.filter.work=xpath://button[contains(text(),'Work')]
notes.filter.personal=xpath://button[contains(text(),'Personal')]

# =========================
# Add Note Modal
# =========================

notes.category.dropdown=id:category
notes.completed.checkbox=id:completed
notes.title=id:title
notes.description=id:description

notes.create.button=xpath://button[contains(text(),'Create')]
notes.cancel.button=xpath://button[contains(text(),'Cancel')]

# =========================
# Note Cards
# =========================

notes.card.container=css:[data-testid='note-card-title']

notes.view.button=xpath://button[contains(text(),'View')]
notes.edit.button=xpath://button[contains(text(),'Edit')]
notes.delete.button=xpath://button[contains(text(),'Delete')]

# Delete Confirmation
notes.delete.confirm.button=xpath://button[contains(text(),'Delete')]